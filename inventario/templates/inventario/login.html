<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Sistema Almacén</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            cursor: pointer;
        }

        .error {
            color: #b00020;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Iniciar sesión</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        {% if form.errors %}
            <div class="error">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <button type="submit">
            Ingresar
        </button>
    </form>

</div>

</body>
</html>
